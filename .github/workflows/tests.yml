name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  nbmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No XAI_API_KEY in CI on purpose: every recipe must run end-to-end in offline demo mode,
      # which is exactly the property we promise readers.
      - run: pytest --nbmake examples/
